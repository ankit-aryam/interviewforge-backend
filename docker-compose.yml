services:

  postgres:
    image: postgres:15
    container_name: interviewforge-postgres
    environment:
      POSTGRES_DB: interviewforge
      POSTGRES_USER: interviewforge
      POSTGRES_PASSWORD: interviewforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: interviewforge-redis
    ports:
      - "6379:6379"

  # Official Apache Kafka image (KRaft combined mode). Bitnami tags like :latest
  # often fail to pull; apache/kafka is maintained by ASF and pulls reliably.
  kafka:
    image: apache/kafka:4.0.2
    container_name: interviewforge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind on all interfaces inside the container. Using localhost here makes Kafka
      # listen only on 127.0.0.1 *inside* the container, so host->published port
      # traffic never reaches the broker (Rebootstrapping / bootstrap disconnected).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Clients on your machine still connect to localhost:9092 (mapped port).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  pgdata:
